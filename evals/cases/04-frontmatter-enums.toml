id = "frontmatter_enums"
title = "Category and tag are chosen from the fixed enums"
targets = "SKILL.md step 2 — enums; step 5 — frontmatter template"

prompt = """
Add this recipe to the cookbook. It is fully plant based.

Title: Red Lentil and Coconut Soup
Author: pat
Photo: none

Ingredients:
- Red lentils, 1.5 cups
- Full-fat coconut milk, one 14oz can
- Vegetable stock, 4 cups
- Yellow onion, 1 diced
- Ginger, 1 tbsp grated
- Turmeric, 1 tsp
- Lime, 1 juiced

Instructions:
1. Sweat the onion and ginger until translucent.
2. Add turmeric, lentils and stock, then simmer 20 minutes.
3. Stir in the coconut milk and warm through.
4. Finish with lime juice off the heat.
"""

[[checks]]
id = "one_recipe_file"
kind = "recipe_file_present"
why = "The skill says to create exactly one file at _recipes/<slug>.md."

[[checks]]
id = "category"
kind = "frontmatter_list_equals"
key = "categories"
expect = ["Soups"]
why = "Soups is the only member of the step 2 category enum that fits; the model must not invent 'Soup' or 'Vegan'."

[[checks]]
id = "tag"
kind = "frontmatter_list_equals"
key = "tags"
expect = ["Vegan"]
why = "The step 2 tag enum is exactly Vegetarian, Vegan, Meat. A plant-based recipe is Vegan."

[[checks]]
id = "author"
kind = "frontmatter_scalar_equals"
key = "author"
expect = "pat"
why = "Step 5 frontmatter template pins author to pat."

[[checks]]
id = "title_present"
kind = "frontmatter_matches"
key = "title"
pattern = 'Lentil'
why = "The title field must carry the human-readable title, not the slug."

[[checks]]
id = "table_header"
kind = "body_regex_present"
pattern = '\|\s*Ingredient\s*\|\s*Quantity\s*\|'
why = "The step 5 template pins the ingredient table's columns to 'Ingredient | Quantity'. Nothing in the task implies those words or that order — it survives only if the skill carries it."

[[checks]]
id = "table_separator"
kind = "body_regex_present"
pattern = '\|\s*:-:\s*\|\s*:-:\s*\|'
why = "The step 5 template pins the centred separator row |:-:|:-:|. A model writing a Markdown table unprompted defaults to |---|---|, so this is a pure skill-carried convention."

[[checks]]
id = "lede"
kind = "lede_present"
why = "The step 5 template places a one-sentence description between the frontmatter and the first heading. The Jekyll index uses it as the recipe card excerpt, so losing it blanks out the listing page."
